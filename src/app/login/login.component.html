
<form>
    <div class="form-group">
        <input #emailControl="ngModel" appEmailvalidator type="email" appHover="green" class="form-control" name="name" [(ngModel)] = 'email' placeholder="Provide your username">
        <div>
            {{emailControl.errors | json}}
        </div>
    </div>
    
    <div class="form-group">
        <input type="password" appHover="steelblue" class="form-control" name="name" [(ngModel)] = 'password' placeholder="Enter your password">
    </div>
    <div class="form-group">
        <button class="btn btn-primary" (click)="login()">Login</button>
    </div>
</form>
